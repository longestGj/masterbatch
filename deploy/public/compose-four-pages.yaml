name: ge-masterbatch-acceptance

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.1-php8.3-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:18087:80"
    env_file:
      - .env.smtp
    environment: &wp-environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GE_GA4_PREVIEW_ONLY: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('SITE_STARTER_LOCAL', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ./site-starter:/var/www/html/wp-content/themes/site-starter:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli-2.12.0-php8.3
    entrypoint: ["wp"]
    profiles: [tools]
    user: "33:33"
    env_file:
      - .env.smtp
    environment: *wp-environment
    volumes: *wp-volumes
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
  wordpress:
