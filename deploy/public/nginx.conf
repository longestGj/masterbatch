limit_req_zone $binary_remote_addr zone=ge_wp_login:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name 152.70.109.64;
    root /var/www/ge-acme;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://152.70.109.64$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 152.70.109.64;
    ssl_certificate /etc/letsencrypt/live/152.70.109.64/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.70.109.64/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /xmlrpc.php {
        return 403;
    }

    location = /wp-login.php {
        limit_req zone=ge_wp_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
